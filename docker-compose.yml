version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-portfolio
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    # Let Coolify + Traefik handle SSL termination and routing via its dashboard
    # Set the domain to https://fennecom.com in the Coolify Application "Domains" setting
