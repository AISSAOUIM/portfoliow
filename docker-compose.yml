version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    # Traefik labels so Coolify automatically routes fennecom.com to this container
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`fennecom.com`, `www.fennecom.com`)"
      - "traefik.http.services.portfolio.loadbalancer.server.port=3000"
